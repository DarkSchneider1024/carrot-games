<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 600px;
    height: 340px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    position: relative;
    background: #0f172a;
  }
  .bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.65) saturate(1.2);
  }
  .gradient-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 75% 50%, rgba(15, 23, 42, 0.2) 0%, rgba(15, 23, 42, 0.85) 100%),
                linear-gradient(to right, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 50%, transparent 100%);
  }
  .jewel-tint {
    position: absolute;
    inset: 0;
    mix-blend-mode: overlay;
    opacity: 0.7;
  }
  .char-container {
    position: absolute;
    right: 20px;
    bottom: -10px;
    height: 360px;
    display: flex;
    align-items: flex-end;
    pointer-events: none;
  }
  .char-img-secondary {
    height: 250px;
    object-fit: contain;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    margin-right: -40px;
    z-index: 1;
    transform: translateY(20px);
  }
  .char-img-primary {
    height: 320px;
    object-fit: contain;
    filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
    z-index: 2;
  }
  .content {
    position: absolute;
    left: 36px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    max-width: 320px;
  }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .title {
    font-size: 32px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 8px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    letter-spacing: 1px;
  }
  .desc {
    font-size: 13px;
    color: #cbd5e1;
    line-height: 1.45;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .decor-border {
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body id="card-body">
  <div class="bg-layer" id="bg"></div>
  <div class="gradient-overlay"></div>
  <div class="jewel-tint" id="tint"></div>
  <div class="decor-border"></div>

  <div class="content">
    <div class="badge" id="badge">卡洛特小鎮</div>
    <h1 class="title" id="title">台灣大老二</h1>
    <p class="desc" id="desc">經典 13 張大老二，與魔法師卡洛特和波波展開智慧對決</p>
  </div>

  <div class="char-container">
    <img class="char-img-secondary" id="char-sec" src="" />
    <img class="char-img-primary" id="char-pri" src="" />
  </div>
</body>
</html>
